# Netlify configuration for the Ponfolio product site.
# The site is a static HTML/CSS/JS page in site/ — no build step required.
[build]
  publish = "site"
  command = ""

# Sensible security headers for a static marketing site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
